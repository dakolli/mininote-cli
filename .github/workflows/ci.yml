# CI for the mirror repo (github.com/dakolli/mininote-cli).
# This file is staged under mininote-gen/publish/ and copied verbatim to
# .github/workflows/ci.yml in the mirror root by the publish script.
# All paths below are relative to the MIRROR ROOT, where the module lives at
# the repo root (go.mod, gen/, cmd/, client/ all at ".").

name: CI

# "on" is quoted so strict YAML 1.1 parsers (e.g. PyYAML/yamllint) don't read
# it as the boolean true; GitHub's parser treats both forms identically.
"on":
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./cmd/mininote

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
